<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04140f" />

    <title>Coquí Cove — Boutique Tropical Glamping in Trujillo Alto, Puerto Rico</title>
    <meta
      name="description"
      content="Coquí Cove is a private boutique glamping retreat in Trujillo Alto, Puerto Rico — minutes from San Juan, surrounded by tropical greenery. A romantic island escape for couples. Check availability."
    />
    <meta name="author" content="Coquí Cove" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://coquicove.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coquí Cove" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Coquí Cove — Boutique Tropical Glamping Near San Juan, Puerto Rico" />
    <meta
      property="og:description"
      content="Close enough to experience Puerto Rico. Secluded enough to disappear into it. A private tropical retreat in Trujillo Alto built for couples and experience-driven travelers."
    />
    <meta property="og:url" content="https://coquicove.com/" />
    <meta
      property="og:image"
      content="https://images.pexels.com/photos/33715469/pexels-photo-33715469.jpeg?auto=compress&cs=tinysrgb&w=1200&h=630&fit=crop"
    />
    <meta property="og:image:alt" content="A glamping retreat surrounded by palms and tropical greenery" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Coquí Cove — Boutique Tropical Glamping, Puerto Rico" />
    <meta
      name="twitter:description"
      content="A private boutique glamping retreat in Trujillo Alto, Puerto Rico. Minutes from San Juan. Built for couples."

      name="twitter:image"
      content="https://images.pexels.com/photos/33715469/pexels-photo-33715469.jpeg?auto=compress&cs=tinysrgb&w=1200&h=630&fit=crop"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LodgingBusiness",
        "name": "Coquí Cove",
        "description": "Boutique tropical glamping retreat in Trujillo Alto, Puerto Rico — a private nature escape minutes from San Juan, designed for couples and experience-driven travelers.",
        "url": "https://coquicove.com/",
        "image": "https://images.pexels.com/photos/33715469/pexels-photo-33715469.jpeg?auto=compress&cs=tinysrgb&w=1200",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Trujillo Alto",
          "addressRegion": "PR",
          "addressCountry": "US"
        },
        "amenityFeature": [
          { "@type": "LocationFeatureSpecification", "name": "Private accommodation", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Outdoor lounge space", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "On-site parking", "value": true }
        ],
        "petsAllowed": false,
        "smokingAllowed": false,
        "knowsLanguage": ["en", "es"],
        "potentialAction": {
          "@type": "ReserveAction",
          "target": "https://coquicove.com/#availability",
          "name": "Check Availability"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
